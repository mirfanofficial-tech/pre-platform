name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prep
          POSTGRES_PASSWORD: prep
          POSTGRES_DB: prepmaster
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U prep -d prepmaster"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PM_DATABASE_URL: postgresql+asyncpg://prep:prep@localhost:5433/prepmaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: alembic upgrade head
      - run: pytest -q
      - name: OpenAPI spec is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code ../docs/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run api:types
          git diff --exit-code src/lib/api-types.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

name: prepmaster

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prepmaster
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d prepmaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PM_ENVIRONMENT: development
      PM_DATABASE_URL: postgresql+asyncpg://prep:prep@db:5432/prepmaster
      PM_CORS_ORIGINS: '["http://localhost:3001"]'
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

volumes:
  dbdata:
